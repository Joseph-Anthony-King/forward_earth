 EMPIRE_DESIGN_humans4:0 "Federação Unida da Terra"
 EMPIRE_DESIGN_humans4_desc:0 "Os trabalhadores humanos unificados que compõem sua federação interestelar compartilham valores comuns de empreendimento coletivo e ajuda mútua. Esses mamíferos bípedes se organizaram em cooperativas democráticas que compartilham recursos e conhecimentos — como resultado, integram-se bem com populações alienígenas que compartilham valores semelhantes."

