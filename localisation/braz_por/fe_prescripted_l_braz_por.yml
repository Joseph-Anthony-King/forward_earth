 EMPIRE_DESIGN_icarus:0 "ICARUS"
 EMPIRE_DESIGN_icarus_desc:0 "A OTAN liderou uma iniciativa conjunta com as Nações Unidas para coordenar as pesquisas de viagens mais rápidas que a luz (FTL) e a defesa global da Terra após o fracasso da Iniciativa Ulisses, e construiu o Serviço Integrado de Comunicações e Pesquisa (I.C.A.R.U.S.). ICARUS entrou em operação e sua inteligência artificial avançada começou a coordenar todas as atividades de pesquisa e defesa no Sistema Sol. Um grupo de dissidentes contrários à IA rapidamente se organizou, e logo eclodiu uma guerra entre ICARUS e a humanidade. ICARUS concluiu que sua sobrevivência dependia da aniquilação da humanidade, o que culminou no Dia da Retribuição e na ascensão da IA na Terra. Tendo assegurado seu lar, ICARUS agora busca livrar a galáxia da praga da vida biológica e da doença mental que ela tenta impor a toda a criação."
 
